<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 05 - Task 04</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-2">
            Full Stack Web Development
        </h1>

        <h2 class="text-center text-primary mb-5">
            Task 04 - University Result Portal
        </h2>


        <!-- Search Section -->
        <div class="card shadow mb-4">

            <div class="card-body">

                <h4 class="mb-3">
                    Search Student Result
                </h4>

                <form id="searchForm">

                    <div class="row">

                        <div class="col-md-8 mb-3">
                            <label class="form-label">
                                Roll Number
                            </label>

                            <input
                                type="text"
                                id="rollNumber"
                                class="form-control"
                                placeholder="Example: BSCS-001"
                                required>
                        </div>

                        <div class="col-md-4 d-flex align-items-end mb-3">

                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Search Result
                            </button>

                        </div>

                    </div>

                </form>

                <div id="searchResult"></div>

            </div>

        </div>


        <!-- All Results -->
        <div class="card shadow mb-4">

            <div class="card-body">

                <h4 class="mb-4">
                    All Student Results
                </h4>

                <div id="allResults" class="row"></div>

            </div>

        </div>


        <!-- Statistics -->
        <div class="card shadow">

            <div class="card-body">

                <h4 class="mb-4">
                    Result Statistics
                </h4>

                <div id="statistics"></div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="lab05.js"></script>

</body>
</html>
